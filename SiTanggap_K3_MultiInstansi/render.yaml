services:
  - type: web
    name: sitanggap-k3
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 app:app
    envVars:
      - key: SITANGGAP_ENV
        value: production
      - key: SITANGGAP_SECRET_KEY
        generateValue: true
      - key: SITANGGAP_ALLOW_ORG_REGISTER
        value: "1"
